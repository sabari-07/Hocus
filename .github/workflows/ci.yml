name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Determinism lint + app-size budget
        run: npm run lint
      - name: Lexicon lint (en/hi/ta)
        run: npm run lexicon:lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, property (100 cases) and replay tests
        run: npm test
      - name: Sabotage mutants (each must be caught by its property)
        run: node scripts/sanity-mutants.mjs
      - name: Self-host MediaPipe models
        run: npm run models
      - name: Build all apps
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end + axe
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
