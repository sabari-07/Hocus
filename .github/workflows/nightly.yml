name: Nightly soak

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Properties with 5000 cases and a date seed
        run: FC_SEED=$(date +%Y%m%d) npm run test:props:nightly
      - name: Benchmark (simulated users)
        run: BENCH_TRIALS=3000 npm run bench
      - name: Mutation testing
        run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reports
          path: |
            reports/mutation/
            docs/benchmark.md
